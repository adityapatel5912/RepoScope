# PR Impact Report — RepoScope PR Bot 2.0
#
# On every PR (opened / updated), calls the RepoScope API to compute the
# architecture impact of the changed files, then posts the report as a PR
# comment: the blast radius, the ARCHITECTURE findings (broken contracts
# with their real consumers, boundary violations, cycles), the merge gate,
# and a mermaid impact graph (GitHub renders mermaid natively).
#
# The strict mode additionally:
#   * uploads the findings as SARIF, so they appear INLINE on the PR diff
#     — where reviewers already look, instead of in a comment they have
#     to scroll to;
#   * BLOCKS the merge when the gate fails.
#
# Requires: repository secret REPOSCOPE_API_URL (optional; defaults to the
# public deployment). Uses the built-in GITHUB_TOKEN to post the comment.

name: PR Impact Report

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to analyze
        required: true
        type: string
      strict:
        description: Block the merge when the gate fails
        required: false
        default: "false"
        type: string

permissions:
  contents: read
  pull-requests: write
  # Required to upload SARIF to GitHub code scanning. Without it the
  # upload step is skipped with a warning rather than failing the run.
  security-events: write

concurrency:
  group: pr-impact-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request impact analysis from RepoScope
        id: impact
        env:
          API_URL: ${{ secrets.REPOSCOPE_API_URL || 'https://reposope.onrender.com/api/impact/pr' }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o impact-response.json -w "%{http_code}" \
            -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -d "{\"repo_url\": \"https://github.com/${REPO}\", \"pr_number\": ${PR}}") || {
              echo "::warning::RepoScope API unreachable — skipping impact report"
              exit 0
            }
          if [ "$http_code" != "200" ]; then
            echo "::warning::RepoScope API returned HTTP ${http_code} — skipping impact report"
            cat impact-response.json || true
            exit 0
          fi
          jq -r '.comment // empty' impact-response.json > impact-comment.md
          if [ ! -s impact-comment.md ]; then
            echo "::warning::RepoScope returned an empty comment — skipping"
            exit 0
          fi
          echo "risk_level=$(jq -r '.risk_level' impact-response.json)" >> "$GITHUB_OUTPUT"

      - name: Post report as PR comment
        if: steps.impact.outputs.risk_level != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          gh pr comment "$PR" --repo "${{ github.repository }}" \
            --body-file impact-comment.md

      # ── The strict mode ───────────────────────────────────────────────
      #
      # SARIF is the GitHub code-scanning standard. Emitting it is what
      # moves the findings from a comment nobody scrolls to, into the
      # diff itself.
      - name: Upload the findings as SARIF
        if: steps.impact.outputs.risk_level != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq -r '.sarif // empty' impact-response.json > results.sarif
          if [ ! -s results.sarif ]; then
            echo "::warning::RepoScope returned no SARIF payload — skipping the upload"
            exit 0
          fi
          # The code-scanning API needs a `category` and a checkout.
          checkout_dir="$RUNNER_TEMP/sarif-upload"
          mkdir -p "$checkout_dir"
          cp results.sarif "$checkout_dir/results.sarif"
          gh api "repos/${{ github.repository }}/code-scanning/sarif" \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            --input "$checkout_dir/results.sarif" || {
              echo "::warning::GitHub rejected the SARIF upload (needs security-events: write)"
              exit 0
            }

      # ── The merge gate ───────────────────────────────────────────────
      #
      # NOTE THE SCALE. The API reports the risk score on a 0-10 scale;
      # `max_allowed_risk_score` below is on a 0-100 scale, because that
      # is what a CI action's input implies. The conversion happens at the
      # ACTION BOUNDARY, and it is documented in
      # `backend/architecture_impact.py` (`normalize_risk_score`).
      #
      # An UNCONVERTED threshold is how a score of 10 becomes 1000 and
      # every gate passes.
      - name: Enforce the merge gate
        if: ${{ steps.impact.outputs.risk_level != '' && (github.event_name == 'workflow_dispatch' && inputs.strict == 'true' || github.event_name == 'pull_request') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          MAX_ALLOWED_RISK_SCORE: "75"
          REQUIRE_TESTS_FOR_HIGH_RISK: "false"
          BLOCK_ON_BREAKING_CONTRACT: "true"
        run: |
          set -euo pipefail

          # The gate's own answer, when the API provides one.
          passed=$(jq -r '.merge_gate.passed // empty' impact-response.json || true)
          blocked_by=$(jq -r '(.merge_gate.blocked_by // []) | join(", ")' impact-response.json || true)
          reasons=$(jq -r '(.merge_gate.reasons // []) | join("; ")' impact-response.json || true)

          # Otherwise the gate is evaluated HERE, on the 0-100 scale.
          if [ -z "$passed" ]; then
            score_0_10=$(jq -r '.risk_score // 0' impact-response.json)
            score_0_100=$(( score_0_10 * 10 ))
            if [ "$score_0_100" -gt "$MAX_ALLOWED_RISK_SCORE" ]; then
              passed="false"
              blocked_by="risk-score"
              reasons="Risk score ${score_0_100}/100 is above the threshold ${MAX_ALLOWED_RISK_SCORE}/100"
            else
              passed="true"
              blocked_by=""
              reasons=""
            fi
          fi

          echo "Gate: passed=${passed} blocked_by=${blocked_by:-none}"

          if [ "$passed" != "true" ]; then
            gh pr comment "$PR" --repo "${{ github.repository }}" \
              --body "**RepoScope merge gate: blocked** by ${blocked_by}. ${reasons}" || true
            echo "::error::The RepoScope merge gate blocked this pull request (${blocked_by})."
            exit 1
          fi
