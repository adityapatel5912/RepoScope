# RepoScope — packaging
#
# Milestone 2.2 (Sprint 3). `reposcope run .` has to work from a
# `pip install`, not only from a checkout, so the project is packaged
# with a real entry point:
#
#     pip install reposcope
#     reposcope run .
#
# The repository layout is unusual on purpose: `backend/` holds the
# modules and `cli/` holds the command. The backend modules import each
# other as TOP-LEVEL names (`from graph_builder import …`), which is why
# the package directory mapping below points the root package at
# `backend/` rather than at the repository root. Renaming those imports
# to relative ones would touch every module in the project for no
# benefit.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reposcope"
version = "2.0.0"
description = "RepoScope — a code graph for humans and agents, over one index."
readme = "README.md"
requires-python = ">=3.11"
# Source-available, not OSI Open Source. The full terms live in LICENSE.
license = { file = "LICENSE" }
authors = [{ name = "Aditya Patel" }]
keywords = ["code-graph", "mcp", "model-context-protocol", "architecture", "tree-sitter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "gitpython>=3.1.43",
    "psutil>=5.9.0",
    "openai>=1.50.0",
    # Graph analysis (PageRank, SCC, reachability) and the architecture
    # rule loader (.reposcope.yml).
    "networkx>=3.2",
    "pyyaml>=6.0",
    # The polyglot parser engine. tree-sitter 0.25 changed its query API:
    # `Query.captures()` is gone and must be
    # `QueryCursor(Query(lang, q)).captures(node)`.
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.0",
    # The CLI (Typer) and the live file watcher (watchdog).
    "typer>=0.12.0",
    "watchdog>=4.0.0",
    # The Model Context Protocol server.
    "mcp>=1.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/adityapatel5912/RepoScope"
Repository = "https://github.com/adityapatel5912/RepoScope"
Issues = "https://github.com/adityapatel5912/RepoScope/issues"

[project.scripts]
reposcope = "cli.main:app"
reposcope-mcp = "mcp_server.server:main"

[tool.setuptools]
# The root package directory is `backend/`, so the backend modules are
# installed as top-level modules — exactly how they import each other.
package-dir = { "" = "backend", "cli" = "cli" }
packages = ["cli", "api", "api.routers", "parsers", "mcp_server"]
py-modules = [
    "ai_byok",
    "arch_rules",
    "byok_manager",
    "git_history",
    "graph_analysis",
    "graph_builder",
    "graph_store",
    "graph_utils",
    "impact_analyzer",
    "json_utils",
    "key_rotator",
    "live_events",
    "main",
    "mcp_client",
    "onboarding",
    "orchestrator",
    "parse_cache",
    "pr_impact",
    "repo_loader",
    "repo_map",
    "repo_tracker",
    "runtime_config",
    "security_scanner",
    "sse",
    "token_metrics",
    "tour_generator",
    "tts_service",
    "watcher",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
