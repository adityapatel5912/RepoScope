services:
  - type: web
    name: reposcope-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_API_KEYS
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: NVIDIA_API_KEYS
        sync: false
      - key: GITHUB_TOKENS
        sync: false
      - key: CODEBASE_MEMORY_PATH
        value: codebase-memory-mcp
      - key: ALLOWED_ORIGINS
        sync: false
      - key: Models_OPENROUTER
        value: google/gemma-4-31b-it:free,qwen/qwen3.8-27b:free
      - key: Models_GROQ
        value: qwen/qwen3.8-27b,openai/gpt-oss-120b
      - key: Models_NVIDIA
        value: meta/muse-glimmer-30b,nvidia/nemotron-3.5-lightning-30b-a3b,nvidia/nemotron-3-ultra-550b-a55b,openai/gpt-oss-20b
